name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    name: lint and build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm ci
        run: npm ci

      - name: npm run lint
        run: npm run lint

      - name: npm run build
        run: npm run build

      - name: install Playwright browsers
        run: |
          npx playwright install --with-deps chromium
          python3 -m pip install --user playwright==1.60.0
          python3 -m playwright install chromium

      - name: start production server
        run: |
          npm run start -- -p 3210 > /tmp/parrit-site.log 2>&1 &
          echo $! > /tmp/parrit-site.pid
          for i in {1..30}; do
            if curl -fsS http://localhost:3210/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/parrit-site.log
          exit 1

      - name: REV 01 network-deny Playwright gate
        env:
          QA_BASE_URL: http://127.0.0.1:3210
        run: npm run qa:network:rev01

      - name: REV 01 brand conformity gate
        run: npm run qa:brand:rev01
